<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VisaWedding Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0d3154;
    }

    .login-box {
      width: 100%;
      max-width: 480px;
      background: white;
      padding: 42px 36px;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    h1 {
      margin: 0;
      text-align: center;
      color: #1473d4;
      font-size: 42px;
    }

    h2 {
      text-align: center;
      margin: 12px 0 8px;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 8px;
      font-size: 17px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #aaa;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1473d4;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 15px;
    }

    .error {
      display: block !important;
      color: #a40000;
      background: #ffe7e7;
    }

    .success {
      display: block !important;
      color: #126b25;
      background: #e6f7e9;
    }

    .notice {
      margin-top: 25px;
      text-align: center;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .login-box {
        padding: 32px 22px;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>VisaWedding</h1>

    <h2>Admin Panel</h2>

    <div class="subtitle">
      Authorized Administrator Login
    </div>

    <form id="adminLoginForm">

      <label for="email">
        Admin Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        autocomplete="username"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        Login to Admin Panel
      </button>

      <div id="message"></div>

    </form>

    <div class="notice">
      Restricted area. Only authorized administrators can access this panel.
    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://ioasowcjabrozmuyzbgf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_MdFHrRzXCKkyeaAHSoRA1Q_UDVa6xs2";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const adminLoginForm =
      document.getElementById("adminLoginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        type === "success"
          ? "success"
          : "error";
    }


    async function verifyAdmin(userId) {

      const { data, error } =
        await supabaseClient
          .from("admin_users")
          .select("user_id")
          .eq("user_id", userId)
          .maybeSingle();

      if (error) {
        console.error(
          "Admin verification error:",
          error
        );

        return false;
      }

      return !!data;
    }


    async function checkExistingAdminSession() {

      const {
        data: { session }
      } =
        await supabaseClient.auth.getSession();

      if (!session || !session.user) {
        return;
      }

      const isAdmin =
        await verifyAdmin(
          session.user.id
        );

      if (isAdmin) {

        window.location.replace(
          "admin.html"
        );

      } else {

        await supabaseClient.auth.signOut();

      }
    }


    adminLoginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        message.style.display = "none";
        message.className = "";

        loginButton.disabled = true;
        loginButton.textContent =
          "Checking Admin Access...";


        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({
                email: email,
                password: password
              });


          if (
            error ||
            !data ||
            !data.user
          ) {

            showMessage(
              "Incorrect email address or password.",
              "error"
            );

            return;
          }


          const isAdmin =
            await verifyAdmin(
              data.user.id
            );


          if (!isAdmin) {

            await supabaseClient.auth.signOut();

            showMessage(
              "Access denied. This account is not an authorized administrator.",
              "error"
            );

            return;
          }


          showMessage(
            "Admin verified. Opening Admin Panel...",
            "success"
          );


          window.location.replace(
            "admin.html"
          );


        } catch (error) {

          console.error(
            "Admin login error:",
            error
          );

          showMessage(
            "Unable to login. Please try again.",
            "error"
          );

        } finally {

          loginButton.disabled = false;

          loginButton.textContent =
            "Login to Admin Panel";
        }

      }
    );


    checkExistingAdminSession();

  </script>

</body>
</html>
