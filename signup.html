<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | VisaWedding</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b1f3a, #163d66);
    }

    .box {
      width: 100%;
      max-width: 480px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    h1 {
      margin: 0;
      text-align: center;
      color: #0b63ce;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin: 8px 0 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
      color: #333;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 9px;
    }

    input:focus {
      outline: none;
      border-color: #0b63ce;
    }

    .terms {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      margin-top: 18px;
      color: #555;
      font-size: 14px;
    }

    .terms label {
      margin: 0;
      font-weight: normal;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #0b63ce;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    #message.error {
      display: block;
      background: #ffe8e8;
      color: #a4001d;
    }

    #message.success {
      display: block;
      background: #e6f7eb;
      color: #16753a;
    }

    .login {
      margin-top: 20px;
      text-align: center;
      color: #666;
    }

    .login a {
      color: #0b63ce;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="box">

    <h1>VisaWedding</h1>
    <div class="subtitle">Create your account</div>

    <form id="signupForm">

      <label for="fullName">Full Name</label>
      <input
        id="fullName"
        type="text"
        autocomplete="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="new-password"
        placeholder="Minimum 8 characters"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Enter password again"
        required
      >

      <div class="terms">
        <input id="terms" type="checkbox" required>
        <label for="terms">
          I agree to the Terms & Conditions and Privacy Policy.
        </label>
      </div>

      <button id="signupButton" type="submit">
        Create Account
      </button>

      <div id="message"></div>

    </form>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </main>

  <script>
    const SUPABASE_URL =
      "https://ioasowcjabrozmuyzbgf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_MdFHrRzXCKkyeaAHSoRA1Q_UDVa6xs2";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const form =
      document.getElementById("signupForm");

    const button =
      document.getElementById("signupButton");

    const message =
      document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    form.addEventListener("submit", async function(event) {

      /* VERY IMPORTANT:
         Stops the page from reloading */
      event.preventDefault();

      const fullName =
        document.getElementById("fullName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        showMessage(
          "Password must be at least 8 characters.",
          "error"
        );
        return;
      }

      if (
        !/[A-Z]/.test(password) ||
        !/[a-z]/.test(password) ||
        !/[0-9]/.test(password)
      ) {
        showMessage(
          "Password must contain an uppercase letter, lowercase letter and number.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "Passwords do not match.",
          "error"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "Creating Account...";

      try {

        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                full_name: fullName
              }
            }
          });

        if (error) {
          throw error;
        }

        sessionStorage.setItem(
          "pendingVerificationEmail",
          email
        );

        sessionStorage.setItem(
          "pendingVerificationName",
          fullName
        );

        showMessage(
          "Account created. Please check your email to confirm your email address.",
          "success"
        );

        setTimeout(function () {
          window.location.href = "verify-email.html";
        }, 2000);

      } catch (error) {

        console.error("Signup error:", error);

        showMessage(
          error.message || "Account could not be created. Please try again.",
          "error"
        );

        button.disabled = false;
        button.textContent = "Create Account";
      }

    });
  </script>

</body>
</html>
