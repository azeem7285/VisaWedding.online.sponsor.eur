<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | VisaWedding</title>

  <!-- Supabase JavaScript Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0b1f3a, #163d66);
      padding: 20px;
    }

    .signup-box {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .logo {
      text-align: center;
      color: #0b63ce;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
      color: #333333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cccccc;
      border-radius: 9px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #0b63ce;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-top: 18px;
      font-size: 14px;
      color: #555555;
    }

    .terms input {
      width: auto;
      margin-top: 2px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #0b63ce;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #084d9e;
    }

    button:disabled {
      background: #8aaed8;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      padding: 11px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .error {
      display: block !important;
      background: #ffe8e8;
      color: #b00020;
    }

    .success {
      display: block !important;
      background: #e6f7eb;
      color: #16753a;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #666666;
    }

    .login-link a {
      color: #0b63ce;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="signup-box">

    <div class="logo">VisaWedding</div>
    <div class="subtitle">
      Create your account
    </div>

    <form id="signupForm">

      <label for="fullName">
        Full Name
      </label>

      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
        autocomplete="name"
        required
      >

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Minimum 8 characters"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Enter password again"
        autocomplete="new-password"
        required
      >

      <div class="terms">

        <input
          type="checkbox"
          id="terms"
          required
        >

        <label
          for="terms"
          style="margin:0; font-weight:normal;"
        >
          I agree to the Terms & Conditions
          and Privacy Policy.
        </label>

      </div>

      <button
        type="submit"
        id="signupButton"
      >
        Create Account
      </button>

      <div id="message"></div>

    </form>

    <div class="login-link">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>


  <script>

    /* ----------------------------------
       SUPABASE CONNECTION
    ---------------------------------- */

    const SUPABASE_URL =
      "https://ioasowcjabrozmuyzbgf.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_MdFHrRzXCKkyeaAHSoRA1Q_UDVa6xs2";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* ----------------------------------
       PAGE ELEMENTS
    ---------------------------------- */

    const form =
      document.getElementById("signupForm");

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("signupButton");


    function showMessage(text, type) {

      message.textContent = text;
      message.className = type;

    }


    /* ----------------------------------
       CREATE ACCOUNT
    ---------------------------------- */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const fullName =
          document
            .getElementById("fullName")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        /* Password validation */

        if (password.length < 8) {

          showMessage(
            "Password must contain at least 8 characters.",
            "error"
          );

          return;
        }


        if (
          !/[A-Z]/.test(password) ||
          !/[a-z]/.test(password) ||
          !/[0-9]/.test(password)
        ) {

          showMessage(
            "Password must include an uppercase letter, lowercase letter and number.",
            "error"
          );

          return;
        }


        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;
        }
