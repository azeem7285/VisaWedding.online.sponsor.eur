<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | VisaWedding</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px;font-family:Arial,sans-serif;
 background:#102d50;
}
.box{
 width:100%;max-width:450px;background:white;padding:32px;
 border-radius:18px;box-shadow:0 12px 35px #0004;
}
h1{margin:0;text-align:center;color:#0867d1;font-size:32px}
.sub{text-align:center;color:#666;margin:10px 0 25px}
label{display:block;margin:15px 0 7px;font-weight:bold}
input{
 width:100%;padding:14px;border:1px solid #bbb;
 border-radius:9px;font-size:16px;
}
button{
 width:100%;margin-top:22px;padding:14px;border:0;
 border-radius:9px;background:#0867d1;color:white;
 font-size:18px;font-weight:bold;cursor:pointer;
}
button:disabled{opacity:.6}
#msg{
 display:none;margin-top:15px;padding:12px;
 border-radius:8px;text-align:center;
}
.error{display:block!important;background:#ffe7e7;color:#a00018}
.success{display:block!important;background:#e5f7e9;color:#167139}
.links{text-align:center;margin-top:20px;color:#666}
a{color:#0867d1;text-decoration:none;font-weight:bold}
</style>
</head>

<body>

<div class="box">
<h1>VisaWedding</h1>
<div class="sub">Login to your account</div>

<form id="form">

<label>Email Address</label>
<input id="email" type="email"
 placeholder="Enter your email" required>

<label>Password</label>
<input id="password" type="password"
 placeholder="Enter your password" required>

<button id="btn" type="submit">Login</button>

<div id="msg"></div>
</form>

<div class="links">
Don't have an account?
<a href="signup.html">Create Account</a>
<br><br>
<a href="index.html">← Back to Home</a>
</div>

</div>
</div>
<script>
const SUPABASE_URL="https://ioasowcjabrozmuyzbgf.supabase.co";
const KEY="sb_publishable_MdFHrRzXCKkyeaAHSoRA1Q_UDVa6xs2";
const sb=window.supabase.createClient(SUPABASE_URL,KEY);
const form=document.getElementById("form");
const msg=document.getElementById("msg");
const btn=document.getElementById("btn");

function message(text,type){
 msg.textContent=text;
 msg.className=type;
}

form.addEventListener("submit",async(e)=>{
 e.preventDefault();

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 btn.disabled=true;
 btn.textContent="Logging in...";

 const {data,error}=await sb.auth.signInWithPassword({
  email:email,
  password:password
 });

 if(error){
  let text=error.message;

  if(text.toLowerCase().includes("invalid login"))
   text="Incorrect email address or password.";

  if(text.toLowerCase().includes("email not confirmed"))
   text="Please confirm your email address first.";

  message(text,"error");
  btn.disabled=false;
  btn.textContent="Login";
  return;
 }

 if(data.user){
  message("Login successful. Opening dashboard...","success");
  setTimeout(()=>{
   window.location.href="dashboard.html";
  },800);
 }
});
</script>

</body>
</html>
