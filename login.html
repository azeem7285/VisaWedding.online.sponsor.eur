<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | VisaWedding</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b1f3a, #163d66);
    }

    .box {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    h1 {
      margin: 0;
      text-align: center;
      color: #0b63ce;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin: 10px 0 28px;
      font-size: 17px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #0b63ce;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 75px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #0b63ce;
      font-weight: bold;
      cursor: pointer;
      width: auto;
      margin: 0;
      padding: 5px;
    }

    .login-button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #0b63ce;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }

    #message.error {
      display: block;
      background: #ffe8e8;
      color: #a4001d;
    }

    #message.success {
      display: block;
      background: #e6f7eb;
      color: #16753a;
    }

    .links {
      margin-top: 22px;
      text-align: center;
      color: #666;
      line-height: 1.8;
    }

    .links a {
      color: #0b63ce;
      font-weight: bold;
      text-decoration: none;
    }

    .home {
      margin-top: 15px;
      text-align: center;
    }

    .home a {
      color: #555;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="box">

    <h1>VisaWedding</h1>
    <div class="subtitle">Login to your account</div>

    <form id="loginForm">

      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Enter your email address"
        required
      >

      <label for="password">Password</label>

      <div class="password-box">
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
        >

        <button
          type="button"
          class="show-password"
          id="showPassword"
        >
          Show
        </button>
      </div>

      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Login
      </button>

      <div id="message"></div>

    </form>

    <div class="links">
      Don't have an account?
      <a href="signup.html">Create Account</a>
    </div>

    <div class="home">
      <a href="index.html">← Back to Home</a>
    </div>

  </main>

  <script>
    const SUPABASE_URL =
      "https://ioasowcjabrozmuyzbgf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_MdFHrRzXCKkyeaAHSoRA1Q_UDVa6xs2";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    const passwordInput =
      document.getElementById("password");

    const showPassword =
      document.getElementById("showPassword");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    showPassword.addEventListener("click", function () {

      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        showPassword.textContent = "Hide";
      } else {
        passwordInput.type = "password";
        showPassword.textContent = "Show";
      }

    });

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email")
            .value.trim();

        const password =
          passwordInput.value;

        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        showMessage(
          "Checking your account...",
          "success"
        );

        try {

          const { data, error } =
            await supabaseClient.auth
              .signInWithPassword({
                email: email,
                password: password
              });

          if (error) {
            throw error;
          }

          if (!data.user) {
            throw new Error(
              "Login could not be completed."
            );
          }

          showMessage(
            "Login successful. Opening dashboard...",
            "success"
          );

          setTimeout(function () {
            window.location.href =
              "dashboard.html";
          }, 1000);
