<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passport Information</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f5f7fb;
  color:#111827;
}

.header{
  background:white;
  padding:24px;
  border-bottom:1px solid #e5e7eb;
}

.header-inner{
  max-width:1000px;
  margin:auto;
}

.header h2{
  margin:0;
}

.container{
  max-width:1000px;
  margin:40px auto;
  background:white;
  padding:40px;
  border-radius:14px;
  box-shadow:0 4px 18px rgba(0,0,0,0.06);
}

.step{
  color:#1d4ed8;
  font-weight:bold;
  margin-bottom:10px;
}

h1{
  margin-top:0;
  font-size:34px;
}

.description{
  color:#6b7280;
  margin-bottom:35px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
}

.full{
  grid-column:1 / -1;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:9px;
}

input,
select{
  width:100%;
  padding:15px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:16px;
  background:white;
}

input:focus,
select:focus{
  outline:none;
  border-color:#2563eb;
}

.buttons{
  display:flex;
  gap:15px;
  margin-top:35px;
}

button{
  padding:14px 26px;
  border:0;
  border-radius:8px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.back{
  background:#e5e7eb;
  color:#111827;
}

.continue{
  background:#1236d4;
  color:white;
}

#message{
  margin-top:20px;
  font-weight:bold;
  color:#15803d;
}

@media(max-width:700px){
  .container{
    margin:20px;
    padding:25px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="header-inner">
    <h2>VisaWedding.online.sponsor.eur</h2>
  </div>
</div>

<div class="container">

  <div class="step">STEP 4 OF 8</div>

  <h1>Passport Information</h1>

  <p class="description">
    Please enter your passport details exactly as they appear on your passport.
  </p>

  <form id="passportForm">

    <div class="form-grid">

      <div>
        <label for="passportNumber">Passport Number *</label>
        <input
          type="text"
          id="passportNumber"
          required
          autocomplete="off"
        >
      </div>

      <div>
        <label for="issuingCountry">Issuing Country *</label>
        <input
          type="text"
          id="issuingCountry"
          required
          placeholder="e.g. Pakistan"
        >
      </div>

      <div>
        <label for="issueDate">Passport Issue Date *</label>
        <input
          type="date"
          id="issueDate"
          min="2010-01-01"
          max="2026-10-02"
          required
        >
      </div>

      <div>
        <label for="expiryDate">Passport Expiry Date *</label>
        <input
          type="date"
          id="expiryDate"
          min="2026-10-02"
          max="2040-12-31"
          required
        >
      </div>

    </div>

    <div class="buttons">

      <button
        type="button"
        class="back"
        onclick="window.location.href='visa-personal-information.html'">
        Back
      </button>

      <button
        type="submit"
        class="continue">
        Save & Continue
      </button>

    </div>

    <div id="message"></div>

  </form>

</div>

<script>

const form = document.getElementById("passportForm");

form.addEventListener("submit", function(event){

  event.preventDefault();

  const passportInformation = {

    passportNumber:
      document.getElementById("passportNumber").value.trim(),

    issuingCountry:
      document.getElementById("issuingCountry").value.trim(),

    issueDate:
      document.getElementById("issueDate").value,

    expiryDate:
      document.getElementById("expiryDate").value

  };

  if(
    passportInformation.expiryDate <=
    passportInformation.issueDate
  ){
    alert("Passport expiry date must be after the issue date.");
    return;
  }

  sessionStorage.setItem(
    "visaPassportInformation",
    JSON.stringify(passportInformation)
  );

  document.getElementById("message").textContent =
    "Passport information saved successfully.";

});

</script>

</body>
</html>
